services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillswap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillswap}
      POSTGRES_DB: ${POSTGRES_DB:-skillswap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillswap}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-skillswap}:${POSTGRES_PASSWORD:-skillswap}@db:5432/${POSTGRES_DB:-skillswap}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8080
      FRONTEND_URL: http://localhost:3000
      UPLOAD_DIR: /uploads
      BASE_URL: http://localhost:8080
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL}
    volumes:
      - uploads_data:/uploads
    ports:
      - "8080:8080"

  db-seed:
    image: postgres:16-alpine
    profiles: ["seed"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-skillswap}
      POSTGRES_USER: ${POSTGRES_USER:-skillswap}
      POSTGRES_DB: ${POSTGRES_DB:-skillswap}
    volumes:
      - ./backend/skillswap/seeds/mock_data.sql:/seed/mock_data.sql:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        until psql -h db -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -c "SELECT 1 FROM information_schema.tables WHERE table_name='users'" | grep -q 1; do
          echo "Waiting for backend migrations to create tables..."
          sleep 2
        done
        psql -v ON_ERROR_STOP=1 -h db -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -f /seed/mock_data.sql
        echo "Mock data loaded successfully."

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data:
